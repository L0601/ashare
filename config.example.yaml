# 抖音多用户内容分析流水线 —— 配置模板
# 复制为 config.yaml 后填入真实值。config.yaml 已被 .gitignore 忽略。

douyin:
  # 抖音网页版登录后的 Cookie（F12 -> Network -> 复制 Cookie 整串）。
  # 公开内容理论上可游客访问，但带登录 Cookie 能显著降低触发风控的概率。
  cookie: "PUT_YOUR_DOUYIN_COOKIE_HERE"
  # 仅用于首次启动迁移第一个用户；迁移后请在 Web 设置中管理多个用户。
  author_sec_uid: ""
  # 博主昵称（仅用于校验/展示；解析时用）。
  author_name: "创业魔法师"
  # 每次抓取最新视频条数
  latest_count: 10
  # User-Agent：必须是「桌面浏览器」UA，与 PC 网页 cookie、web 接口、桌面指纹保持一致。
  # 最佳实践：用你复制 cookie 那个浏览器的真实 UA（F12 控制台输入 navigator.userAgent）。
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36 Edg/130.0.0.0"

llm:
  # 兼容 OpenAI 的服务地址，如 DeepSeek: https://api.deepseek.com/v1
  base_url: "https://api.deepseek.com/v1"
  api_key: "PUT_YOUR_LLM_API_KEY_HERE"
  model: "deepseek-chat"
  # 单次请求超时（秒）与温度
  timeout: 120
  temperature: 0.2

asr:
  # Intel Mac 默认：SenseVoice Small INT8 + sherpa-onnx CPU
  engine: "sensevoice"
  # 模型目录，内含 model.int8.onnx 与 tokens.txt
  model: "models/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-int8-2024-07-17"
  language: "zh"
  # 与本机 4 个物理核心匹配
  num_threads: 4
  # 长音频按静音附近切片，避免整段推理随时长急剧变慢
  chunk_seconds: 30
  # 开启逆文本归一化，例如把口述数字转为阿拉伯数字
  use_itn: true

schedule:
  # 轮询间隔（分钟）。活跃博主建议 90~120，避免过频触发风控。
  poll_interval_minutes: 90
  # 单个网络请求之间的基础间隔与随机抖动（秒），错峰防风控。
  request_min_seconds: 5
  request_jitter_seconds: 3

storage:
  # 数据根目录（SQLite 与中间文件均在此）
  data_dir: "data"

web:
  host: "127.0.0.1"
  port: 8000

telegram:
  # 视频处理完成后把结果推送到 Telegram。可在 Web 后台「设置」里开关与填写。
  enabled: false
  bot_token: ""      # BotFather 给的 token，形如 123456789:AAxxxxxxxxxxxxxxxxxxxxxxxxxxxx
  chat_id: ""        # 目标会话/群 id（群为负数，形如 -1001234567890）

wecom:
  # 企业微信群机器人推送。Web 后台只提供开关，webhook 必须保存在本地 config.yaml。
  enabled: false
  webhook_url: ""    # https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=YOUR_KEY
